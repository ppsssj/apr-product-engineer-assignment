name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      # gradlew is tracked without the executable bit (git mode 100644).
      - run: chmod +x ./gradlew

      - run: ./gradlew test

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  full-stack-smoke:
    name: full-stack-smoke
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: apr-ci-${{ github.run_id }}-${{ github.run_attempt }}
      DB_PORT: 25432
      BACKEND_PORT: 28080
      FRONTEND_PORT: 23000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build and smoke-test production stack
        run: ./scripts/ci-full-stack-smoke.sh

      - name: Run Playwright browser regression tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:${{ env.FRONTEND_PORT }}
          E2E_API_BASE_URL: http://localhost:${{ env.BACKEND_PORT }}/api
        run: npm run test:e2e

      - name: Compose failure diagnostics
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color --tail=200 || true

      - name: Remove disposable Compose resources
        if: always()
        run: docker compose down -v --remove-orphans
